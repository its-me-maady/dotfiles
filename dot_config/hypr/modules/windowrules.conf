
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 0
  match:fullscreen = 0
  match:pin = 0
}

windowrule {
  name = windowrule-3
  border_size = 0
  match:float = 0
  match:workspace = w[tv1]s[false]
}



