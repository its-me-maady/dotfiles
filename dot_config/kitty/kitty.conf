# --- Tokyo Night Storm Theme Colors ---
font_family JetBrains Nerd Mono
background #0f111a
foreground #c8d3f5
cursor     #7dcfff
selection_background #2d3b55

color0  #1b1d2b
color1  #ff757f
color2  #c3e88d
color3  #ffc777
color4  #82aaff
color5  #c099ff
color6  #86e1fc
color7  #d6deeb
color8  #2e3248
color9  #ff98a4
color10 #ddffa7
color11 #ffe585
color12 #9ecbff
color13 #d9bfff
color14 #b4f9f8
color15 #ffffff

# --- Transparency Settings ---
background_opacity 0.60    
enable_mouse_reporting yes
cursor_trail 100
cursor_trail_decay 0.1 0.4 
cursor_trail_start_threshold 2
hide_window_decoration yes
tab_bar_style powerline
tab_bar_min_tab 1
tab_powerline_style round
shell /usr/bin/zsh
